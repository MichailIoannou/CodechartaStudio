[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
codecharta-core = { path = "crates/codecharta-core" }
codecharta-core-api = { path = "crates/codecharta-core-api" }
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
