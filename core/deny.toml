# Policy for `cargo deny check licenses sources`, run by the core_licences job in
# .github/workflows/test_core.yml.

[graph]
all-features = true

[licenses]
# The SPDX ids that ../license_policy.json (the policy the analysis and visualization SBOMs are checked
# against) marks "allow", minus the deprecated ids Nunit and StandardML-NJ, which cargo-deny refuses to
# parse (SMLNJ, the current id for StandardML-NJ, is listed). A licence becomes acceptable here only
# after it is allowed there.
allow = [
    "0BSD",
    "AFL-1.1",
    "AFL-1.2",
    "AFL-2.0",
    "AFL-2.1",
    "AFL-3.0",
    "Apache-1.0",
    "Apache-1.1",
    "Apache-2.0",
    "Beerware",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "BSL-1.0",
    "CECILL-B",
    "CNRI-Jython",
    "CNRI-Python",
    "Condor-1.1",
    "curl",
    "ECL-1.0",
    "ECL-2.0",
    "EFL-1.0",
    "EFL-2.0",
    "Entessa",
    "EPL-1.0",
    "EUDatagrid",
    "Fair",
    "FSFUL",
    "FTL",
    "GD",
    "HPND",
    "ICU",
    "IJG",
    "IJG-short",
    "ImageMagick",
    "ISC",
    "JasPer-2.0",
    "JSON",
    "Libpng",
    "libpng-2.0",
    "LPL-1.0",
    "LPL-1.02",
    "MirOS",
    "MIT",
    "MS-PL",
    "MulanPSL-1.0",
    "MulanPSL-2.0",
    "Naumen",
    "NCSA",
    "NTP",
    "OGC-1.0",
    "OGTSL",
    "OLDAP-1.1",
    "OLDAP-1.2",
    "OLDAP-1.3",
    "OLDAP-1.4",
    "OLDAP-2.0",
    "OLDAP-2.0.1",
    "OLDAP-2.1",
    "OLDAP-2.2",
    "OLDAP-2.2.1",
    "OLDAP-2.2.2",
    "OLDAP-2.3",
    "OLDAP-2.4",
    "OLDAP-2.5",
    "OLDAP-2.6",
    "OLDAP-2.7",
    "OLDAP-2.8",
    "OpenSSL",
    "PHP-3.0",
    "PHP-3.01",
    "PostgreSQL",
    "PSF-2.0",
    "Python-2.0",
    "Python-2.0.1",
    "Sendmail",
    "SMLNJ",
    "TCL",
    "TOSL",
    "Unlicense",
    "UPL-1.0",
    "VSL-1.0",
    "W3C",
    "W3C-19980720",
    "W3C-20150513",
    "WTFPL",
    "X11",
    "XFree86-1.1",
    "xinetd",
    "Xnet",
    "Zlib",
    "ZPL-1.1",
    "ZPL-2.0",
    "ZPL-2.1",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = [
    # Unicode-3.0 is neither allowed nor denied in license_policy.json. unicode-ident needs it and is a
    # build-time dependency of every proc macro used here (serde, clap, thiserror, ts-rs, tokio), so it
    # cannot be avoided. Remove this exception once the owner has added Unicode-3.0 to the policy.
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
