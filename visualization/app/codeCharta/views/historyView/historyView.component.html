@if (isDesktop()) {
    <cc-git-history-panel (relinkFolder)="relink.start($event)" (openDesktopTools)="configuration.open()" />
    <cc-relink-folder #relink />
    <cc-global-configuration-dialog #configuration />
} @else {
    <div class="flex h-full flex-col items-center justify-center gap-3" data-testid="history-desktop-only">
        <p class="text-base-content/70">Commit history is available in the desktop app.</p>
        <a class="btn btn-sm" [routerLink]="routeLinks.metrics">Show the map</a>
    </div>
}
