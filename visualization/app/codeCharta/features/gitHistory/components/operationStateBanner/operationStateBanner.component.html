@if (notice(); as notice) {
    <div role="status" class="alert alert-warning mx-2 mt-2 flex flex-col items-start gap-1 px-2 py-1 text-xs" data-testid="history-operation-notice">
        <span data-testid="history-operation-notice-text">{{ notice.text }}</span>
        <div class="flex flex-wrap gap-2" data-testid="history-operation-actions">
            @if (notice.abortable; as operation) {
                <button
                    type="button"
                    class="btn btn-ghost btn-xs"
                    data-testid="history-operation-abort"
                    [disabled]="isBusy()"
                    [title]="isBusy() ? waitingTitle : ''"
                    (click)="abort()"
                >
                    Abort {{ operation }}…
                </button>
            }
            <button type="button" class="btn btn-ghost btn-xs" data-testid="history-operation-refresh" (click)="refresh()">Refresh</button>
        </div>
    </div>
}
