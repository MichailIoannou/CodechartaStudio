<cc-floating-menu
    class="w-max min-w-64 max-w-[32rem]"
    data-testid="branch-context-menu"
    [anchor]="target().anchor"
    (dismissed)="dismiss()"
    (positioned)="focusFirstItemIfFromKeyboard()"
    (keydown)="onKeydown($event)"
>
    @for (item of items(); track item.action) {
        <cc-context-menu-item [icon]="item.icon" [hoverHint]="item.disabledReason ?? item.hint" [disabled]="item.disabledReason !== null" (itemClick)="run(item)">{{
            item.label
        }}</cc-context-menu-item>
    }
    @if (contributedTarget(); as contributedTarget) {
        @if (contributed().length > 0) {
            <div class="my-1 border-t border-base-300"></div>
        }
        @for (action of contributed(); track action.id) {
            <cc-context-menu-item [icon]="action.icon" [hoverHint]="action.hoverHintFor(contributedTarget)" (itemClick)="runContributed(action, contributedTarget)">{{
                action.labelFor(contributedTarget)
            }}</cc-context-menu-item>
        }
    }
</cc-floating-menu>
