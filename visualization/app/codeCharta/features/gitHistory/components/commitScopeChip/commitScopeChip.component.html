@if (refNames().length === 0) {
    <span class="badge badge-ghost badge-sm" data-testid="commit-scope-chip">All branches</span>
} @else {
    <span class="badge badge-ghost badge-sm inline-flex max-w-40 gap-1 pr-0.5" [title]="title()" data-testid="commit-scope-chip">
        <span class="truncate">{{ label() }}</span>
        <button
            type="button"
            class="btn btn-ghost btn-xs btn-circle h-4 min-h-4 w-4 shrink-0"
            title="Show all branches"
            aria-label="Show all branches"
            (click)="showAllBranches()"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>
    </span>
}
