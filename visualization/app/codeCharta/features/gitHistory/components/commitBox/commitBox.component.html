@if (commits.isMerging()) {
    <p class="text-xs text-base-content/60" data-testid="commit-box-merge">This commit concludes the merge.</p>
}
<label class="input input-bordered input-sm flex w-full items-center gap-2">
    <input
        type="text"
        class="grow"
        placeholder="Summary"
        aria-label="Summary"
        data-testid="commit-summary"
        [value]="commits.message().subject"
        (input)="editSubject($event)"
    />
    <span
        class="text-xs tabular-nums"
        [class.text-warning]="isSummaryLong()"
        [title]="counterTitle()"
        data-testid="commit-summary-counter"
        >{{ summaryLength() }}/{{ summaryLimit }}</span
    >
</label>
<textarea
    class="textarea textarea-bordered textarea-sm w-full resize-y"
    rows="3"
    placeholder="Description"
    aria-label="Description"
    data-testid="commit-description"
    [value]="commits.message().body"
    (input)="editBody($event)"
></textarea>
<div class="flex items-center gap-2">
    <label class="flex cursor-pointer items-center gap-2 text-sm">
        <input type="checkbox" class="checkbox checkbox-sm" data-testid="commit-amend" [checked]="commits.isAmend()" (change)="toggleAmend($event)" />
        Amend last commit
    </label>
    <span class="ml-auto" [title]="commits.disabledReason() ?? ''">
        <button
            type="button"
            class="btn btn-primary btn-sm gap-1.5"
            data-testid="commit-button"
            [disabled]="commits.disabledReason() !== null"
            (click)="commit()"
        >
            Commit
            <span class="font-normal opacity-70">(Ctrl+Enter)</span>
        </button>
    </span>
</div>
