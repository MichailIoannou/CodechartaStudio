<div class="join" data-testid="sync-button">
    <button
        type="button"
        class="btn btn-sm btn-outline join-item gap-1.5 border-base-300 font-normal"
        data-testid="sync-button-main"
        [disabled]="isMainDisabled()"
        [title]="mainTitle()"
        [attr.aria-label]="label()"
        (click)="runMain()"
    >
        <i class="fa-fw {{ action().icon }}"></i>
        <span class="hidden xl:inline">{{ label() }}</span>
        @if (!running()) {
            @if (action().behind !== null) {
                <span class="inline-flex items-center gap-0.5 text-xs tabular-nums" data-testid="sync-button-behind"
                    ><i class="fa-solid fa-arrow-down"></i>{{ action().behind }}</span
                >
            }
            @if (action().ahead !== null) {
                <span class="inline-flex items-center gap-0.5 text-xs tabular-nums" data-testid="sync-button-ahead"
                    ><i class="fa-solid fa-arrow-up"></i>{{ action().ahead }}</span
                >
            }
        }
    </button>
    @if (running(); as running) {
        <button
            type="button"
            class="btn btn-sm btn-outline btn-square join-item border-base-300"
            [title]="'Cancel the ' + running.noun"
            [attr.aria-label]="'Cancel the ' + running.noun"
            data-testid="sync-button-cancel"
            (click)="cancel()"
        >
            <i class="fa-solid fa-stop"></i>
        </button>
    } @else {
        <button
            type="button"
            class="btn btn-sm btn-outline btn-square join-item border-base-300"
            aria-label="More sync actions"
            data-testid="sync-button-caret"
            aria-haspopup="menu"
            [disabled]="isBusy()"
            [title]="isBusy() ? mainTitle() : 'More sync actions'"
            [attr.aria-expanded]="menuAnchor() !== null"
            (pointerdown)="$event.stopPropagation()"
            (click)="toggleMenu($event)"
        >
            <i class="fa-solid fa-caret-down"></i>
        </button>
    }
</div>
@if (menuAnchor(); as anchor) {
    <cc-floating-menu class="w-max min-w-64 max-w-[32rem]" data-testid="sync-menu" [anchor]="anchor" (dismissed)="closeMenu()">
        @for (item of menuItems(); track item.action) {
            <cc-context-menu-item
                [icon]="item.icon"
                [hoverHint]="item.hint"
                [disabledReason]="item.disabledReason"
                [attr.data-testid]="'sync-menu-' + item.action"
                (itemClick)="runMenuItem(item)"
                >{{ item.label }}</cc-context-menu-item
            >
        }
    </cc-floating-menu>
}
