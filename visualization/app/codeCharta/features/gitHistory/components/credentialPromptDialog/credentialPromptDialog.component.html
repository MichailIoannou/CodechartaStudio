@if (isDesktop()) {
    <dialog #dialog class="modal" aria-labelledby="cc-credential-prompt-title" data-testid="credential-prompt" (close)="onClosed()">
        <form class="modal-box flex max-w-md flex-col gap-3" (submit)="submit($event)">
            <h2 id="cc-credential-prompt-title" class="text-xl font-bold">{{ title() }}</h2>
            @if (prompt(); as prompt) {
                @if (prompt.repositoryLabel) {
                    <p class="text-sm text-base-content/60" data-testid="credential-prompt-repository">{{ prompt.repositoryLabel }}</p>
                }
                <pre id="cc-credential-prompt-message" class="max-h-48 overflow-auto whitespace-pre-wrap rounded-md bg-base-200 p-2 font-mono text-xs" data-testid="credential-prompt-message">{{ prompt.message }}</pre>
                @if (prompt.kind !== "confirm") {
                    <input
                        #answerInput
                        class="input input-bordered w-full"
                        aria-labelledby="cc-credential-prompt-message"
                        autocomplete="off"
                        spellcheck="false"
                        data-testid="credential-prompt-input"
                        [type]="prompt.kind === 'secret' ? 'password' : 'text'"
                        [attr.maxlength]="maxAnswerLength"
                    />
                    <p class="text-xs text-base-content/60">CodeCharta passes this to git once and does not keep it.</p>
                }
                <div class="modal-action mt-0">
                    @if (prompt.kind === "confirm") {
                        <button #noButton type="button" class="btn" data-testid="credential-prompt-no" (click)="answerConfirm('no')">No</button>
                        <button type="button" class="btn btn-primary" data-testid="credential-prompt-yes" (click)="answerConfirm('yes')">Yes</button>
                    } @else {
                        <button type="button" class="btn" data-testid="credential-prompt-cancel" (click)="cancel()">Cancel</button>
                        <button type="submit" class="btn btn-primary" data-testid="credential-prompt-ok">OK</button>
                    }
                </div>
            }
        </form>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
}
