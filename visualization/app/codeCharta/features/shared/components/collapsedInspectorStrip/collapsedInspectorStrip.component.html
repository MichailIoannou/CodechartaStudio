<div class="flex items-center gap-1 px-2 py-1">
    <button
        type="button"
        class="indicator btn btn-ghost btn-sm btn-square shrink-0"
        [title]="showTitle()"
        [attr.aria-label]="showTitle()"
        (click)="expand.emit()"
        data-testid="inspector-expand-button"
    >
        @if (hasUnseenSelection()) {
            <span class="indicator-item badge badge-primary badge-xs" data-testid="inspector-selection-changed"></span>
        }
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
    </button>
    <span class="flex-1 min-w-0 truncate text-xs opacity-70" [title]="path()" data-testid="inspector-collapsed-name">{{ name() }}</span>
</div>
