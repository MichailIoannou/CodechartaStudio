<div class="flex min-w-0 flex-1 items-center gap-1 rounded-md bg-base-200 px-2 py-1 font-mono text-xs text-base-content" data-testid="copy-command">
    <code class="min-w-0 flex-1 whitespace-pre-wrap break-all text-left">{{ command() }}</code>
    <button type="button" class="btn btn-ghost btn-xs btn-square shrink-0" title="Copy command" aria-label="Copy command" (click)="copy()">
        <i [class]="clipboard.copied() ? 'fa-solid fa-check' : 'fa-regular fa-copy'"></i>
    </button>
</div>
