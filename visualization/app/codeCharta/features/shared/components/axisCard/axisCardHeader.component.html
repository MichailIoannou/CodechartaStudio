<div class="flex min-h-6 items-center justify-between gap-1" data-card-header>
    <span class="min-w-0 truncate text-[10px] uppercase tracking-wide text-base-content/60" data-bar-text>{{ label() }}</span>
    @if (hasCog()) {
        <button
            type="button"
            [class]="cogButtonClasses()"
            [attr.popovertarget]="cogPopoverId()"
            [style.anchor-name]="cogAnchorStyle()"
            [attr.data-anchor-name]="cogAnchorName()"
            [attr.data-testid]="cogTestId()"
            [attr.title]="cogTitle()"
            [attr.aria-label]="cogTitle()"
        >
            @if (cogIcon(); as icon) {
                <ng-container [ngTemplateOutlet]="icon"></ng-container>
            } @else {
                <i class="fa fa-cog text-[10px]" aria-hidden="true"></i>
            }
        </button>
    }
</div>
