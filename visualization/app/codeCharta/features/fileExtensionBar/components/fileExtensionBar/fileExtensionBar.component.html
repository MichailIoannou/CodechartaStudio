<div class="flex h-[17px] w-full">
    <cc-distribution-metric title="Distribution metric"></cc-distribution-metric>
    <div class="flex w-full">
        @for (item of metricDistribution().visible; track item.fileExtension; let index = $index, first = $first, last = $last) {
            <cc-file-extension-bar-segment [item]="item"
                                           [previousColor]="first ? null : metricDistribution().visible[index - 1].color"
                                           [nextColor]="last ? null : metricDistribution().visible[index + 1].color"
                                           [showAbsoluteValues]="showAbsoluteValues()"
                                           (toggleShowAbsoluteValues)="toggleShowAbsoluteValues()">
            </cc-file-extension-bar-segment>
        }
    </div>
</div>
