<dialog #dialog class="modal" aria-labelledby="move-snapshot-title" data-testid="move-snapshot-dialog">
    <div class="modal-box max-w-md">
        <h2 id="move-snapshot-title" class="mb-4 text-xl font-bold">{{ title() }}</h2>

        <div class="grid grid-cols-[4.5rem_minmax(0,1fr)] items-center gap-x-2 gap-y-2 text-sm">
            <span class="col-span-2 break-all font-medium" data-testid="move-snapshot-file">{{ fileLine() }}</span>

            <label class="text-base-content/60" for="move-snapshot-folder">Folder</label>
            <select
                id="move-snapshot-folder"
                class="select select-bordered select-sm w-full"
                data-testid="move-snapshot-folder"
                (change)="chooseFolder($any($event.target).value)"
            >
                @for (folder of folders(); track folder.id) {
                    <option [value]="folder.id" [selected]="folder.id === folderId()">{{ folder.label }}</option>
                }
            </select>

            <label class="text-base-content/60" for="move-snapshot-commit">Commit</label>
            <div class="flex gap-2">
                <input
                    id="move-snapshot-commit"
                    class="input input-bordered input-sm min-w-0 flex-1 font-mono"
                    data-testid="move-snapshot-commit"
                    [value]="hash()"
                    (input)="typeHash($any($event.target).value)"
                    (keydown.enter)="checkCommit()"
                />
                <button type="button" class="btn btn-sm" data-testid="move-snapshot-check" [disabled]="!canCheck()" (click)="checkCommit()">
                    @if (check().kind === "checking") {
                        <span class="loading loading-spinner loading-xs"></span>
                    }
                    Check
                </button>
            </div>
            <span class="col-start-2 text-xs" data-testid="move-snapshot-check-result">
                @switch (check().kind) {
                    @case ("found") {
                        <span class="text-success"><i class="fa-solid fa-check"></i> {{ commitLine() }}</span>
                    }
                    @case ("notFound") {
                        <span class="text-warning">Not a commit of '{{ folderLabel() }}'.</span>
                    }
                    @default {
                        <span class="text-base-content/60">Leave empty to keep it unbound</span>
                    }
                }
            </span>
        </div>

        @if (failure(); as failure) {
            <div role="alert" class="alert alert-error mt-4 text-sm" data-testid="move-snapshot-failure">{{ failure }}</div>
        }

        <div class="modal-action">
            <button type="button" class="btn" (click)="close()">Cancel</button>
            <button type="button" class="btn btn-primary" data-testid="move-snapshot-submit" [disabled]="!canMove()" (click)="move()">
                @if (isMoving()) {
                    <span class="loading loading-spinner loading-sm"></span>
                }
                {{ primaryLabel() }}
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
