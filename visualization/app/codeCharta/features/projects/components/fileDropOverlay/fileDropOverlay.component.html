@if (isDraggingFile()) {
    <div
        class="pointer-events-none fixed inset-0 z-[1000] flex flex-col items-center justify-center gap-3 border-4 border-dashed border-primary bg-base-100/80"
        data-testid="file-drop-overlay"
    >
        <i class="fa-solid fa-file-import text-4xl text-primary"></i>
        <span class="text-lg font-medium">Drop a cc.json file to open it</span>
    </div>
}
