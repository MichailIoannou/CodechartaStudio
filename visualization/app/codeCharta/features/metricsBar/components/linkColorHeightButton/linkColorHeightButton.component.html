<button
    type="button"
    [class]="buttonClass()"
    [attr.title]="isCompact() ? null : title()"
    [attr.aria-label]="title()"
    [attr.data-tip]="isCompact() ? title() : null"
    [attr.data-testid]="'metric-link-button'"
    [attr.aria-pressed]="isLinked()"
    (click)="toggle()"
>
    <i [class]="iconClass()"></i>
</button>
